<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo Lỗi &amp; Góp Ý - Học Liệu 12A1 Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a href="dashboard.html" class="logo">
        <div class="logo-icon-box"><i class="fa-solid fa-comments"></i></div>
        <span>Cộng Đồng <strong>Báo Lỗi 12A1 Pro</strong></span>
      </a>
    </div>
    <div class="header-right">
      <a href="dashboard.html" class="nav-pill"><i class="fa-solid fa-house"></i> Về Trang Chủ</a>
    </div>
  </header>
  <main class="main-content">
    <section class="comments-section">
      <h3 class="text-lg font-extrabold text-slate-800 mb-3"><i class="fa-solid fa-comments text-pink-600 mr-2"></i> Báo Lỗi &amp; Góp Ý Thời Gian Thực</h3>
      <div class="comment-compose-box">
        <img id="commentComposeAvatar" class="comment-avatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=Student12A1" alt="Avatar">
        <div class="comment-input-area">
          <textarea id="reportContent" rows="4" placeholder="Nhập nội dung báo lỗi hoặc góp ý..."></textarea>
          <div class="comment-compose-footer">
            <select id="reportTagSelect" class="text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white font-semibold">
              <option value="Lỗi đáp án / Đề thi">📝 Lỗi đáp án / Đề thi</option>
              <option value="Báo lỗi kỹ thuật">🐞 Báo lỗi kỹ thuật</option>
            </select>
            <button id="btnSubmitReportPage" class="btn-primary" type="button"><i class="fa-solid fa-paper-plane"></i> Đăng Báo Lỗi</button>
          </div>
        </div>
      </div>
      <div class="comments-feed" id="bugCommentsFeed"></div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
